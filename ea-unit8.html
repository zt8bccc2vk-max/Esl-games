<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>EA Unit 8 — Time &amp; What Should I Take?</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,system-ui,"Segoe UI",Arial,sans-serif;background:#eaf6ff;color:#16324f}
header{background:#2a9df4;color:#fff;padding:14px 16px;text-align:center}
header h1{margin:0;font-size:26px} header p{margin:4px 0 0;font-size:15px;opacity:.95}
.stars{font-size:22px;text-align:center;padding:8px;background:#fff3a6;font-weight:700}
nav{display:flex;gap:8px;padding:10px;max-width:900px;margin:0 auto}
nav button{flex:1;padding:16px 6px;font-size:18px;font-weight:700;border:0;border-radius:16px;background:#fff;color:#16324f;box-shadow:0 2px 6px rgba(0,0,0,.15)}
nav button.active{background:#ff8a3d;color:#fff}
main{max-width:900px;margin:0 auto;padding:6px 12px 30px}
section{display:none} section.active{display:block}
.prompt{background:#fff;border-radius:20px;padding:18px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.12);margin-bottom:14px}
.prompt .q{font-size:24px;font-weight:800;margin:0 0 6px}
.prompt .hint{font-size:16px;color:#5a7186;margin:0 0 12px}
.big-speak{font-size:20px;font-weight:800;padding:14px 22px;border:0;border-radius:999px;background:#2a9df4;color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}.grid.items{grid-template-columns:repeat(4,1fr)}}
.card{background:#fff;border:4px solid transparent;border-radius:20px;padding:14px 8px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.12);cursor:pointer;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.card:active{transform:scale(.97)}
.card .label{font-size:19px;font-weight:700}
.card .emoji{font-size:64px;line-height:1}
.card.correct{border-color:#2ecc71;background:#eafff2}
.card.wrong{border-color:#ff6b6b;background:#fff0f0;animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.feedback{min-height:56px;text-align:center;font-size:24px;font-weight:800;padding:10px}
.sentence{text-align:center;font-size:21px;font-weight:700;color:#0b6fa4;background:#fff;border-radius:14px;padding:12px;margin-top:4px;display:none}
.next{display:block;margin:12px auto 0;font-size:20px;font-weight:800;padding:14px 28px;border:0;border-radius:999px;background:#2ecc71;color:#fff}
.sunmoon{font-size:26px}
</style>
</head>
<body>
<header><h1>🕐 EA Unit 8</h1><p>What time is the show? • What should I take?</p></header>
<div class="stars">⭐ <span id="stars">0</span></div>
<nav>
  <button id="tab-learn" class="active" onclick="showTab('learn')">📚 Learn</button>
  <button id="tab-time" onclick="showTab('time')">🕐 Time Game</button>
  <button id="tab-pack" onclick="showTab('pack')">🎒 Pack Game</button>
</nav>
<main>
<section id="learn" class="active">
  <div class="prompt"><p class="q">Tap a clock or an item!</p><p class="hint">Touche une horloge ou un objet pour écouter.</p></div>
  <div class="grid" id="learn-times"></div>
  <div style="height:14px"></div>
  <div class="grid items" id="learn-items"></div>
</section>

<section id="time">
  <div class="prompt"><p class="q">What time is the show?</p><p class="hint">Listen, then tap the right clock.</p>
  <button class="big-speak" onclick="speakTime(true)">🔊 Listen</button></div>
  <div class="grid" id="time-grid"></div>
  <div class="feedback" id="time-feedback"></div>
  <div class="sentence" id="time-sentence"></div>
</section>

<section id="pack">
  <div class="prompt"><p class="q">What should I take?</p><p class="hint">Listen: “You should take …” — then tap it!</p>
  <button class="big-speak" onclick="speakPack(true)">🔊 Listen</button></div>
  <div class="grid items" id="pack-grid"></div>
  <div class="feedback" id="pack-feedback"></div>
  <div class="sentence" id="pack-sentence"></div>
</section>
</main>
<script>
const TIMES=[
 {h:7,m:0,ap:'a.m.',label:'7:00 a.m.',spoken:"seven o'clock a.m.",icon:'☀️'},
 {h:9,m:15,ap:'a.m.',label:'9:15 a.m.',spoken:'nine fifteen a.m.',icon:'☀️'},
 {h:10,m:10,ap:'a.m.',label:'10:10 a.m.',spoken:'ten ten a.m.',icon:'☀️'},
 {h:1,m:5,ap:'p.m.',label:'1:05 p.m.',spoken:'one oh five p.m.',icon:'☀️'},
 {h:8,m:30,ap:'p.m.',label:'8:30 p.m.',spoken:'eight thirty p.m.',icon:'🌙'},
 {h:11,m:45,ap:'p.m.',label:'11:45 p.m.',spoken:'eleven forty-five p.m.',icon:'🌙'}
];
const ITEMS=[
 {name:'an umbrella',emoji:'☂️',spoken:'You should take an umbrella.'},
 {name:'a camera',emoji:'📷',spoken:'You should take a camera.'},
 {name:'a wallet',emoji:'👛',spoken:'You should take a wallet.'},
 {name:'a scarf',emoji:'🧣',spoken:'You should take a scarf.'},
 {name:'a trash bag',emoji:'🛍️',spoken:'You should take a trash bag.'},
 {name:'lunch',emoji:'🍱',spoken:'You should take lunch.'},
 {name:'snacks',emoji:'🍪',spoken:'You should take snacks.'},
 {name:'gloves',emoji:'🧤',spoken:'You should take gloves.'}
];
let stars=0, timeTarget=null, packTarget=null, locked=false;
function speak(text){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=0.82;const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith('en'));if(v)u.voice=v;speechSynthesis.speak(u);}catch(e){}}
if('speechSynthesis' in window) speechSynthesis.getVoices();
function addStars(){stars++;document.getElementById('stars').textContent=stars;}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function clockSVG(t){
 const ma=(t.m%60)*6, ha=((t.h%12)+t.m/60)*30; const cx=60,cy=60,r=52;
 let ticks='';for(let i=0;i<12;i++){const a=i*30*Math.PI/180,x1=cx+Math.sin(a)*44,y1=cy-Math.cos(a)*44,x2=cx+Math.sin(a)*50,y2=cy-Math.cos(a)*50;ticks+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#16324f" stroke-width="3"/>`;}
 return `<svg width="120" height="120" viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="#fff" stroke="#e74c3c" stroke-width="5"/>${ticks}<line x1="60" y1="60" x2="${cx+Math.sin(ha*Math.PI/180)*30}" y2="${cy-Math.cos(ha*Math.PI/180)*30}" stroke="#16324f" stroke-width="6" stroke-linecap="round"/><line x1="60" y1="60" x2="${cx+Math.sin(ma*Math.PI/180)*44}" y2="${cy-Math.cos(ma*Math.PI/180)*44}" stroke="#16324f" stroke-width="4" stroke-linecap="round"/><circle cx="60" cy="60" r="5" fill="#e74c3c"/></svg>`;
}
function showTab(id){document.querySelectorAll('section').forEach(s=>s.classList.remove('active'));document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));document.getElementById(id).classList.add('active');document.getElementById('tab-'+id).classList.add('active');if(id==='time'&&!timeTarget)newTimeRound();if(id==='pack'&&!packTarget)newPackRound();}
// Learn
const lt=document.getElementById('learn-times');
TIMES.forEach(t=>{const d=document.createElement('div');d.className='card';d.innerHTML=clockSVG(t)+`<span class="label">${t.label}</span><span class="sunmoon">${t.icon}</span>`;d.onclick=()=>speak(`It's at ${t.spoken} On February nineteenth.`);lt.appendChild(d);});
const li=document.getElementById('learn-items');
ITEMS.forEach(it=>{const d=document.createElement('div');d.className='card';d.innerHTML=`<span class="emoji">${it.emoji}</span><span class="label">${it.name}</span>`;d.onclick=()=>speak(it.spoken);li.appendChild(d);});
// Time game
function newTimeRound(){locked=false;document.getElementById('time-feedback').textContent='';const s=document.getElementById('time-sentence');s.style.display='none';
 timeTarget=TIMES[Math.floor(Math.random()*TIMES.length)];
 const opts=shuffle(TIMES.filter(t=>t!==timeTarget)).slice(0,3);const all=shuffle([timeTarget,...opts]);
 const g=document.getElementById('time-grid');g.innerHTML='';
 all.forEach(t=>{const d=document.createElement('div');d.className='card';d.innerHTML=clockSVG(t)+`<span class="label">${t.label}</span><span class="sunmoon">${t.icon}</span>`;
  d.onclick=()=>{if(locked)return;if(t===timeTarget){locked=true;d.classList.add('correct');addStars();document.getElementById('time-feedback').textContent='🎉 Great job!';s.textContent=`It's at ${timeTarget.label} on February 19th.`;s.style.display='block';speak(`Yes! It's at ${timeTarget.spoken}`);setTimeout(newTimeRound,2600);}else{d.classList.add('wrong');document.getElementById('time-feedback').textContent='💪 Try again!';speak('Try again!');setTimeout(()=>d.classList.remove('wrong'),400);}};
  g.appendChild(d);});
 setTimeout(()=>speakTime(false),350);
}
function speakTime(user){if(!timeTarget)newTimeRound();speak(`What time is the show? It's at ${timeTarget.spoken}`);}
// Pack game
function newPackRound(){locked=false;document.getElementById('pack-feedback').textContent='';const s=document.getElementById('pack-sentence');s.style.display='none';
 packTarget=ITEMS[Math.floor(Math.random()*ITEMS.length)];
 const opts=shuffle(ITEMS.filter(i=>i!==packTarget)).slice(0,5);const all=shuffle([packTarget,...opts]);
 const g=document.getElementById('pack-grid');g.innerHTML='';
 all.forEach(it=>{const d=document.createElement('div');d.className='card';d.innerHTML=`<span class="emoji">${it.emoji}</span><span class="label">${it.name}</span>`;
  d.onclick=()=>{if(locked)return;if(it===packTarget){locked=true;d.classList.add('correct');addStars();document.getElementById('pack-feedback').textContent='🎉 Great job!';s.textContent=packTarget.spoken;s.style.display='block';speak('Yes! '+packTarget.spoken);setTimeout(newPackRound,2600);}else{d.classList.add('wrong');document.getElementById('pack-feedback').textContent='💪 Try again!';speak('Try again!');setTimeout(()=>d.classList.remove('wrong'),400);}};
  g.appendChild(d);});
 setTimeout(()=>speakPack(false),350);
}
function speakPack(user){if(!packTarget)newPackRound();speak(`What should I take? ${packTarget.spoken}`);}
</script>
</body>
</html>
